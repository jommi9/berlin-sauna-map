name: Post a review
description: Review a sauna on the map. Approved reviewers only.
title: "Review: "
labels: ["review"]
body:
  - type: markdown
    attributes:
      value: |
        Only reviews from approved reviewers are published. If you have not applied yet,
        open a **Reviewer application** first.
  - type: input
    id: venue
    attributes:
      label: Venue
      description: Exactly as it appears on the map, e.g. "KIEZ SAUNA Friedrichshain".
    validations: { required: true }
  - type: dropdown
    id: rating
    attributes:
      label: Rating out of 5
      options: ["5", "4", "3", "2", "1"]
    validations: { required: true }
  - type: input
    id: visited
    attributes:
      label: When did you go?
      placeholder: 2026-09-01
    validations: { required: true }
  - type: textarea
    id: verdict
    attributes:
      label: Your review
      description: What it is actually like. Heat, crowd, Aufguss, whether you would go back.
    validations: { required: true }
